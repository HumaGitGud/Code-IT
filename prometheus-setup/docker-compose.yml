services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed -e "s|%%HUB_TOKEN%%|$$HUB_TOKEN|g" -e "s|%%HUB_IP%%|$$HUB_IP|g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.console.libraries=/usr/share/prometheus/console_libraries \
          --web.console.templates=/usr/share/prometheus/consoles
    environment:
      - HUB_TOKEN=${HUB_TOKEN}
      - HUB_IP=${HUB_IP}
    volumes:
      - ./prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_LOG_MODE=console file
    volumes:
      - ./datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./logs:/var/log/grafana